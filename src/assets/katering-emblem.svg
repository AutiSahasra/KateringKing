  <!-- Crown Jewels at Tips -->
  <circle cx="50" cy="25" r="1.3" fill="#FFFFFF" />
  <circle cx="40" cy="28.5" r="1.1" fill="#FFFFFF" />
  <circle cx="60" cy="28.5" r="1.1" fill="#FFFFFF" />
