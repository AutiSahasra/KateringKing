<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="katering-emblem-svg">
  <defs>
    <!-- Mask to keep sunburst behind cloche and crown -->
    <mask id="clocheMask">
      <rect width="100" height="100" fill="white" />
      <!-- Cut out cloche dome and base -->
      <path d="M26 66 C26 44, 74 44, 74 66 Z" fill="black" />
      <rect x="23" y="65" width="54" height="6" rx="3" fill="black" />
      <!-- Cut out crown area -->
      <polygon points="36,44 38,30 45,36 50,26 55,36 62,30 64,44" fill="black" />
    </mask>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" stroke="#FFFFFF" stroke-width="2.2" />
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="41" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Sunburst Rays with Mask -->
  <g mask="url(#clocheMask)" opacity="0.85">
